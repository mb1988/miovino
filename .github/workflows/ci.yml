name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx vite build

  # Pull requests → miovino-preview (own D1 database, never touches real data)
  deploy-preview:
    if: github.event_name == 'pull_request' && vars.CF_DEPLOY == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply miovino-preview --remote --env preview
      - run: npx vite build
      - run: npx wrangler deploy

  # main → production. Migrations run before the new code goes live; roll back with `npx wrangler rollback`.
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Back up the database before migrating
        run: |
          npx wrangler d1 export miovino --remote --output pre-deploy.sql
          gzip pre-deploy.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-pre-deploy-${{ github.sha }}
          path: pre-deploy.sql.gz
          retention-days: 90
      - run: npx wrangler d1 migrations apply miovino --remote
      - run: npx vite build
      - run: npx wrangler deploy
