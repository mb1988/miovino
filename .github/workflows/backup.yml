name: Database backup

on:
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      drill:
        description: Also run the restore drill
        type: boolean
        default: false

jobs:
  backup:
    if: vars.CF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export D1 → R2 (kept 90 days by lifecycle rule)
        run: |
          npx wrangler d1 export miovino --remote --output backup.sql
          gzip -k backup.sql
          npx wrangler r2 object put "miovino-backups/d1/$(date -u +%Y-%m-%d).sql.gz" --file backup.sql.gz --remote
          echo "rows: $(grep -c '^INSERT' backup.sql)" >> "$GITHUB_STEP_SUMMARY"

      # First of each month (or on demand): prove the backup restores into a throwaway database.
      - name: Restore drill
        run: |
          [ "$(date -u +%d)" = "01" ] || [ "${{ inputs.drill }}" = "true" ] || { echo "Not drill day"; exit 0; }
          npx wrangler d1 create miovino-restore-drill --location weur
          trap 'npx wrangler d1 delete miovino-restore-drill --skip-confirmation' EXIT
          npx wrangler d1 execute miovino-restore-drill --remote --file backup.sql --yes
          EXPECTED=$(npx wrangler d1 execute miovino --remote --command "SELECT COUNT(*) AS n FROM records" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].results[0].n))")
          GOT=$(npx wrangler d1 execute miovino-restore-drill --remote --command "SELECT COUNT(*) AS n FROM records" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].results[0].n))")
          echo "Restore drill: live rows=$EXPECTED, restored rows=$GOT" >> "$GITHUB_STEP_SUMMARY"
          [ "$EXPECTED" = "$GOT" ]
